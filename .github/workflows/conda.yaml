# Builds and tests the tt-npe conda package from conda/ on pushes to main and
# on PRs. A manual run with publish set also publishes the package as the
# release vVERSION-conda.N, from the recipe's version and build number.
name: conda

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built package as its release"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: conda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          run-install: false
      # The recipe's tests import the binding and model a sample workload.
      - name: build
        run: |
          pixi exec -s "rattler-build 0.80.*" -- rattler-build build \
            --recipe conda/recipe.yaml --variant-config conda/variants.yaml --output-dir dist
          sha256sum dist/linux-64/*.conda
      - uses: actions/upload-artifact@v7
        with:
          name: conda
          path: dist/linux-64/*.conda
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: conda
          path: dist
      # The package is tt-npe-VERSION-HASH_N.conda, from the recipe's version
      # and build number.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package=$(ls dist/tt-npe-*.conda)
          name=${package##*/tt-npe-}
          version=${name%%-*}
          number=${name##*_}
          TAG="v$version-conda.${number%.conda}"
          gh release create "$TAG" "$package" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes "tt-npe at $GITHUB_SHA as a conda package for linux-64. Pin it by URL and the sha256 below."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.url) \(.digest)"'
